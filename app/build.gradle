plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.suntek.checkoutapplication'
    compileSdk 36

    defaultConfig {
        applicationId "com.suntek.checkoutapplication"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    // 唤醒模型（onnx）不压缩：aapt 压缩后每次加载都要解压，首次唤醒会明显变慢
    androidResources {
        noCompress += ['onnx']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/printersdkv5.7.3.jar')

    // sherpa-onnx：离线关键词唤醒（KeywordSpotter）。含 arm64-v8a / armv7 的 ONNX Runtime。
    // 本地 aar 引入（无需联网下载依赖），配套 kotlin-stdlib 也放在 libs/ 里（它由 Kotlin 编译，
    // 运行时需要 kotlin.* 类，而本项目是纯 Java 工程）。
    implementation files('libs/sherpa-onnx-1.12.20.aar')
}